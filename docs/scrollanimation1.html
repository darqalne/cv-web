<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo — Kaydırmalı Kurulum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E3E2DD;
  --ink:#0A0A0B;
  --rule:#C4C3BB;
  --muted:#6E6C64;
  --accent:#B4651A;
  --S: min(50vw, 88vh);
  --u: calc(var(--S) / 1000);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}

.frame{position:fixed;inset:0;pointer-events:none;z-index:4}
.frame .edge{position:absolute;top:0;bottom:0;width:1px;background:var(--rule);opacity:.75}
.frame .edge.l{left:calc(50% - var(--S)/2)}
.frame .edge.r{left:calc(50% + var(--S)/2)}

.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;
  justify-content:space-between;padding:20px 22px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);pointer-events:none}
.top b{font-weight:500;color:var(--ink)}

.rail{position:fixed;left:22px;top:50%;transform:translateY(-50%);z-index:5;
  width:64px;height:min(56vh,420px);pointer-events:none}
.rail .line{position:absolute;left:0;top:0;bottom:0;width:1px;background:var(--rule)}
.rail i{position:absolute;left:0;width:7px;height:1px;background:var(--rule);display:block}
.rail i.major{width:14px;background:var(--muted)}
.rail .lab{position:absolute;left:20px;font-size:10px;color:var(--muted);
  letter-spacing:.08em;transform:translateY(-50%)}
.rail .cursor{position:absolute;left:-4px;width:22px;height:2px;background:var(--accent);
  transition:top .08s linear}
.rail .depth{position:absolute;left:26px;font-size:11px;color:var(--accent);
  transform:translateY(-50%);white-space:nowrap;transition:top .08s linear;font-weight:500}
.rail .title{position:absolute;left:0;top:-26px;font-size:10px;letter-spacing:.18em;
  color:var(--muted);text-transform:uppercase}

.stagewrap{position:fixed;inset:0;display:grid;place-items:center;z-index:1}
.stage{position:relative;width:var(--S);height:var(--S)}
.layer{position:absolute;opacity:0}
.layer .mv{display:block;will-change:transform}
.layer img{display:block;width:100%;height:auto}

.caption{position:fixed;left:22px;bottom:24px;z-index:5;max-width:min(30ch,26vw);pointer-events:none}
.caption .no{font-family:"Anton",Impact,sans-serif;font-size:44px;line-height:.85;
  letter-spacing:.02em;color:var(--accent)}
.caption .nm{font-family:"Anton",Impact,sans-serif;font-size:19px;letter-spacing:.06em;
  margin-top:8px;text-transform:uppercase}
.caption .tx{font-size:11.5px;line-height:1.55;color:var(--muted);margin-top:6px}
.caption>*{transition:opacity .25s ease}

.hint{position:fixed;right:22px;bottom:24px;z-index:5;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);pointer-events:none;transition:opacity .3s}
.hint span{display:inline-block;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}

.spacer{height:820vh}

@media (max-width:900px){
  :root{--S:min(80vw,62vh)}
  .rail{display:none}
  .frame .edge{opacity:.4}
  .caption{max-width:none;right:22px;bottom:20px}
  .caption .no{font-size:34px}
  .caption .nm{font-size:16px}
  .top{font-size:10px;padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){ .hint,.rail .cursor,.rail .depth{display:none} }
</style>
</head>

<div class="caption" id="cap">
  <div class="no" id="capNo">01</div>
  <div class="nm" id="capNm">Baret</div>
  <div class="tx" id="capTx">Sayfanın ortasında tam boy başlar, yerine küçülür.</div>
</div>

<div class="hint" id="hint">Kaydır <span>↓</span></div>
<div class="spacer"></div>

<script>
(function(){
  var L = [{"k": "cember", "t": [0.4, 0.52], "from": {}, "type": "draw"}, {"k": "sol", "t": [0.3, 0.4], "from": {"dy": 100}, "type": ""}, {"k": "sag", "t": [0.31, 0.41], "from": {"dy": 100}, "type": ""}, {"k": "yan", "t": [0.2, 0.31], "from": {"dy": 130}, "type": ""}, {"k": "tek", "t": [0.1, 0.21], "from": {"dy": 160}, "type": ""}, {"k": "kaya", "t": [0.52, 0.63], "from": {"dy": 150}, "type": ""}, {"k": "galeri", "t": [0.63, 0.71], "from": {"dy": 60, "s": 0.94}, "type": ""}, {"k": "giris", "t": [0.63, 0.71], "from": {"dy": 60, "s": 0.94}, "type": ""}, {"k": "isik", "t": [0.71, 0.8], "from": {}, "type": ""}, {"k": "lamba", "t": [0.76, 0.85], "from": {"dy": -18}, "type": ""}, {"k": "kazma", "t": [0.85, 0.94], "from": {"dx": -360, "dy": -70, "rot": -115}, "type": ""}, {"k": "balyoz", "t": [0.87, 0.96], "from": {"dx": 360, "dy": -70, "rot": 115}, "type": ""}, {"k": "baret", "t": [0.0, 0.1], "from": {"dy": 370, "s": 2.05, "o0": 1}, "type": ""}];

  var STEPS = [
    [0.00,'01','Baret','Sayfanın ortasında tam boy başlar, yerine küçülür.'],
    [0.10,'02','Binalar','Önce merkez kule, sonra yanındaki iki kule, en son sağ ve sol silüetler.'],
    [0.40,'03','Çember','Dış hat tepeden başlayıp saat yönünde kapanır.'],
    [0.52,'04','Kaya kütlesi','Maden kayası kendi ayırıcı hattıyla yükselir ve tabanı dolar.'],
    [0.63,'05','Maden girişi','Kiriş ve dikmeler oturur, içi karanlık galeri olarak açılır.'],
    [0.71,'06','Gaz lambası','Beyaz hüzmeler galerinin içinde belirir, lamba iner.'],
    [0.85,'07','Kazma & balyoz','İkisi dönerek girer ve logodaki yerine oturur.']
  ];

  var els={}, mvs={};
  L.forEach(function(l){
    var e=document.getElementById('ly-'+l.k);
    els[l.k]=e; mvs[l.k]=e.firstElementChild;
  });
  var capNo=document.getElementById('capNo'), capNm=document.getElementById('capNm'),
      capTx=document.getElementById('capTx'), cap=document.getElementById('cap'),
      hint=document.getElementById('hint'), pct=document.getElementById('pct'),
      cursor=document.getElementById('cursor'), depth=document.getElementById('depth');

  var ticks=document.getElementById('ticks'), html='';
  for (var i=0;i<=25;i++){
    var major=(i%5===0);
    html+='<i class="'+(major?'major':'')+'" style="top:'+(i*4)+'%"></i>';
    if(major) html+='<div class="lab" style="top:'+(i*4)+'%">'+(i*50)+'</div>';
  }
  ticks.innerHTML=html;

  var clamp=function(v,a,b){return v<a?a:(v>b?b:v)};
  var ease=function(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
  var seg=function(p,a,b){return ease(clamp((p-a)/(b-a),0,1))};
  var lastStep=-1;

  function render(p){
    for (var i=0;i<L.length;i++){
      var l=L[i], e=els[l.k], mv=mvs[l.k], t=seg(p,l.t[0],l.t[1]);
      if (l.type==='draw'){
        e.style.opacity = t>0?1:0;
        var deg=(t*360).toFixed(1)+'deg';
        var m='conic-gradient(from -96deg, #000 0deg '+deg+', rgba(0,0,0,0) '+deg+')';
        e.style.webkitMaskImage=m; e.style.maskImage=m;
      } else {
        var f=l.from||{}, o0=f.o0||0,
            dx=(f.dx||0)*(1-t), dy=(f.dy||0)*(1-t),
            rt=(f.rot||0)*(1-t), s=1+((f.s||1)-1)*(1-t);
        e.style.opacity=o0+(1-o0)*Math.min(1,t*1.8);
        mv.style.transform='translate(calc('+dx+' * var(--u)), calc('+dy+' * var(--u))) rotate('+rt.toFixed(2)+'deg) scale('+s.toFixed(4)+')';
      }
    }
    pct.textContent='%'+Math.round(p*100);
    var top=clamp(p,0,1)*100;
    cursor.style.top=top+'%'; depth.style.top=top+'%';
    depth.textContent=Math.round(p*1250)+' m';
    hint.style.opacity=p<0.02?1:0;

    var s=0;
    for (var k=0;k<STEPS.length;k++) if(p>=STEPS[k][0]) s=k;
    if(s!==lastStep){
      lastStep=s;
      capNo.textContent=STEPS[s][1]; capNm.textContent=STEPS[s][2]; capTx.textContent=STEPS[s][3];
      cap.style.opacity=0;
      requestAnimationFrame(function(){cap.style.opacity=1});
    }
  }

  var ticking=false,p=0;
  function onScroll(){
    var max=document.documentElement.scrollHeight-window.innerHeight;
    p=max>0?clamp(window.scrollY/max,0,1):0;
    if(!ticking){ticking=true;requestAnimationFrame(function(){render(p);ticking=false})}
  }
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){ render(1); }
  else { window.addEventListener('scroll',onScroll,{passive:true});
         window.addEventListener('resize',onScroll); onScroll(); }
})();
</script>
